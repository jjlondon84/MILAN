spring.application.name=barberia-milan
server.port=8080

# --- Credenciales: se leen del archivo .env (ver .env.example) ---
# El .env va en la carpeta backend y NO se sube a git.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# --- Conexión a MySQL (base creada con db/barberia_milan.sql en Workbench) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/barberia_milan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- JPA: el esquema lo crea el script SQL (tablas, triggers, vistas y procedimientos),
#     por eso Hibernate no debe modificarlo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=America/Bogota

# --- Frontend: se sirve desde la carpeta ../Fronted en http://localhost:8080 ---
spring.web.resources.static-locations=file:../Fronted/,file:Fronted/,classpath:/static/

# --- Swagger (springdoc-openapi) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Seguridad ---
# Clave AES-256 (Base64 de 32 bytes) para cifrar datos sensibles. Va en .env.
app.seguridad.clave-aes=${APP_AES_KEY:}
# Costo de bcrypt (2^12 iteraciones)
app.seguridad.bcrypt-costo=12
# Duración de una sesión (horas)
app.sesion.horas=${APP_SESION_HORAS:12}
# Minutos de vigencia del enlace de recuperación de contraseña
app.recuperacion.minutos=30
# Sin servidor de correo: en desarrollo la API devuelve el token de recuperación
# en la respuesta para poder probarlo en Postman. Ponlo en false en producción.
app.recuperacion.mostrar-token=${APP_RECUPERACION_MOSTRAR_TOKEN:true}

# Administrador inicial: se crea al arrancar si la tabla usuario está vacía
app.admin.usuario=${APP_ADMIN_USUARIO:admin}
app.admin.contrasena=${APP_ADMIN_CONTRASENA:Milan2026*}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador MILAN}
app.admin.email=${APP_ADMIN_EMAIL:admin@milanbarberia.co}
